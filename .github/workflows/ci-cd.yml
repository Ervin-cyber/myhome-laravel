name: CI / CD

on:
  push:
    branches:
      - prod
  pull_request:
    branches:
      - prod
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force a full build of all images'
        required: false
        default: 'false'
        type: boolean

env:
  NODE_VERSION: '20'
  PHP_VERSION: '8.4'
  DOCKER_REGISTRY: 'docker.io'
  IMAGE_NAMESPACE: '${{ secrets.DOCKERHUB_USERNAME }}'

jobs:
  # 1. Detect changes
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'api/**'
            frontend:
              - 'public/**'

  # 2. Test API (remains on GitHub hosted for speed/reliability of env)
  test-api:
    name: Test API
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, pdo, pdo_sqlite, zip
          cache: composer
      - name: Install PHP dependencies
        working-directory: ./api
        run: composer install --no-interaction --prefer-dist --optimize-autoloader
      - name: Run PHP tests
        working-directory: ./api
        env:
          APP_KEY: base64:uS38FzS7S8R3XpYJz8x5W6V7U8T9S0R1Q2P3O4N5M6L=
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
        run: composer test

  # 3. Test Frontend
  test-frontend:
    name: Test Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ./public/package-lock.json
      - name: Install frontend dependencies
        working-directory: ./public
        run: npm ci
      - name: Lint/Type-check Frontend
        working-directory: ./public
        run: npm run lint

  # 4. Build API (Runs on your Raspberry Pi - NATIVE ARM64)
  build-api:
    name: Build & Push API (Native)
    needs: [changes, test-api]
    if: |
      always() &&
      github.ref == 'refs/heads/prod' &&
      (needs.changes.outputs.api == 'true' || github.event.inputs.force_build == 'true') &&
      (needs.test-api.result == 'success' || needs.test-api.result == 'skipped')
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      
      - name: Log in to Docker registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push Laravel app image
        uses: docker/build-push-action@v5
        with:
          context: ./api
          file: api/Dockerfile
          push: true
          # No platforms: linux/arm64 needed because it builds natively on the host architecture
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/laravel:latest
            ${{ env.IMAGE_NAMESPACE }}/laravel:${{ github.sha }}

  # 5. Build Frontend (Runs on your Raspberry Pi - NATIVE ARM64)
  build-frontend:
    name: Build & Push Frontend (Native)
    needs: [changes, test-frontend]
    if: |
      always() &&
      github.ref == 'refs/heads/prod' &&
      (needs.changes.outputs.frontend == 'true' || github.event.inputs.force_build == 'true') &&
      (needs.test-frontend.result == 'success' || needs.test-frontend.result == 'skipped')
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push Next.js frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./public
          file: public/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/nextjs-frontend:latest
            ${{ env.IMAGE_NAMESPACE }}/nextjs-frontend:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_REVERB_APP_KEY=85r6cbqutni8angnhqkd
            NEXT_PUBLIC_REVERB_HOST=home.papstack.net
            NEXT_PUBLIC_REVERB_PORT=443
            NEXT_PUBLIC_REVERB_SCHEME=https
